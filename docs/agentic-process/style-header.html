<!-- Style for agentic-process.html; included with pandoc -H (see README.md). -->
<style>
  :root {
    --bg: #f4f5f7;        /* page */
    --paper: #ffffff;     /* content card */
    --ink: #1f2328;
    --muted: #57606a;
    --rule: #c9ced6;
    --head: #d5d9e0;      /* table header */
    --row-a: #ffffff;     /* odd rows */
    --row-b: #eceef2;     /* even rows */
    --col-tint: rgba(0, 0, 0, 0.035); /* every other column */
    --accent: #3d5a80;
  }
  html { background: var(--bg); }
  body {
    max-width: 62em; margin: 2em auto; padding: 2em 2.5em;
    background: var(--paper); color: var(--ink);
    font: 16px/1.55 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    border: 1px solid var(--rule); border-radius: 6px;
  }
  h1, h2, h3, h4 { color: var(--accent); line-height: 1.25; }
  h1.title { border-bottom: 2px solid var(--rule); padding-bottom: .3em; }
  h2 { border-bottom: 1px solid var(--rule); padding-bottom: .2em; margin-top: 2em; }
  a { color: var(--accent); }
  code { background: var(--row-b); padding: .1em .3em; border-radius: 3px; font-size: .92em; }
  pre { background: var(--row-b); padding: .8em 1em; border-radius: 4px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  blockquote { border-left: 4px solid var(--rule); margin-left: 0; padding-left: 1em; color: var(--muted); }
  nav#TOC { background: var(--row-b); padding: .6em 1.2em; border-radius: 4px; }

  table {
    border-collapse: collapse; margin: 1.2em 0; width: 100%;
    font-size: .93em; border: 1px solid var(--rule);
  }
  th, td { padding: .45em .7em; border: 1px solid var(--rule); vertical-align: top; text-align: left; }
  thead th, tr.header th { background: var(--head); font-weight: 600; }
  tbody tr:nth-child(odd)  td { background: var(--row-a); }
  tbody tr:nth-child(even) td { background: var(--row-b); }
  /* alternate column brightness on top of the row stripes */
  tbody td:nth-child(even) { background-image: linear-gradient(var(--col-tint), var(--col-tint)); }
  thead th:nth-child(even) { background-image: linear-gradient(var(--col-tint), var(--col-tint)); }
  tbody tr:hover td { background: #dde3ec; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --paper: #1e2126; --ink: #e6e8eb; --muted: #a0a7b0; --rule: #3a3f47;
      --head: #353a42; --row-a: #1e2126; --row-b: #272b31; --col-tint: rgba(255,255,255,0.04); --accent: #8fb3de;
    }
    tbody tr:hover td { background: #2f3540; }
  }
  @media print {
    html, body { background: #fff; border: none; margin: 0; max-width: none; }
  }
</style>
