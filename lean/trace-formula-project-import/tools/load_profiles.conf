# tools/load_profiles.conf (T-D25c): committed machine load profiles, selected per machine by LOAD_PROFILE=<name> in the
# gitignored tools/deps.local.conf. Read by tools/deps_load.sh; lines `<profile>.<KEY>=<integer>` only.
# A profile changes ONLY pre-flight thresholds (MemAvailable before a job starts) and may switch heavy jobs off. It never
# changes a cap (BUILD_MEMORY_MAX 8G, FILE_MEMORY_MAX 6G, the 16G audit cap), LEAN_NUM_THREADS=2, the lock, or the pin
# (D8 / D21 stay). deps_load.sh refuses a threshold below its cap + 1 GiB and any profile whose APPROVED is not 1.
# Changing this file is a lead action after the user's decision (MAIN-owned, tools/**).
#
# r2-16g: R2's machine, 16 GB RAM (D25 amendment c, proposed 2026-11-06). Light jobs only (amendment b):
#   FILE_MEM_MIN_KB  8 GiB  = 6G file cap + 2 GiB for the OS and the session;
#   BUILD_MEM_MIN_KB 10 GiB = 8G build cap + 2 GiB (targeted +Module builds; the one base build);
#   HEAVY_LEAN 0: lbuild.sh refuses --audit*, --lc-probe, tfaudit/PrintAxioms/Vendor targets, and the umbrella targets
#   GL2TF/GL2TFTests unless GL2TF_ALLOW_UMBRELLA=1 (setup base build, rebuild after merging a main tag; user OK first).
r2-16g.APPROVED=1   # approved by the user 2026-11-06 ("I approve any changes imposed on us by the memory reduction")
r2-16g.FILE_MEM_MIN_KB=8388608
r2-16g.BUILD_MEM_MIN_KB=10485760
r2-16g.HEAVY_LEAN=0
