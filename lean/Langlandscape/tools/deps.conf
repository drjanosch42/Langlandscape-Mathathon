# COPY of lean/trace-formula-project-import/tools/deps.conf @a4efa59 (S01-X1a, 2026-11-14), changed: deps.conf: GL2TF_IMPORT (new), DEP_ROOTS += AlgJL AlgJLTests Definitions FLT (FROZEN_TREES += $GL2TF_IMPORT is appended in deps_load.sh).
# tools/deps.conf: the single D1 switch (docs/decisions/D1-mathlib-version.md). Sourced by the tools/*.sh scripts.
# Changing anything here is a D1 change: it invalidates every sign-off and needs the user's approval.
# D1 = option B (decided 2026-10-17), pin superseded by D24 (2026-11-01, docs/decisions/D24-d1-v435-migration.md):
# Mathlib v4.35.0 via the symlink farm /home/janosch/data/gl2tf-deps-v4350 into the shared, frozen tree mathlib4_v4350.

# Directory holding one checkout per Lake package (mathlib, batteries, aesop, ...). FROZEN: read-only.
DEPS_TREE=/home/janosch/data/gl2tf-deps-v4350

# Mathlib commit (tag v4.35.0; D24) and the toolchain that built the tree. Old pin (D1, until mig-baseline):
# db584cd6d46c92f209a44c0f1c829460d327499d / leanprover/lean4:v4.33.0.
MATHLIB_REV=56a005855ea17e0b0958f73ec801ae140b0a1679
LEAN_TOOLCHAIN=leanprover/lean4:v4.35.0

# Trees checked with `find -newer <marker>` after every Lean process (space-separated). Must include DEPS_TREE.
# v4350 itself is listed because find does not follow the farm's symlinks; the old D1 tree and v4310 stay frozen.
FROZEN_TREES="/home/janosch/data/mathlib4_v4350 /home/janosch/data/gl2tf-deps-v4350 /home/janosch/data/orbifold-cohomology-of-gl2/lean-deps /home/janosch/data/mathlib4_v4310"

# Lock directory (ext4) and limits (PLAN.md §5.3, D8). Do not raise.
LOCK_DIR=/home/janosch/.cache/gl2tf
# LOCK_WAIT 7200 s: user decision 2026-10-26 (t4), above the ~70 min of a full --audit.
LOCK_WAIT=7200
SLOTS=2
MEM_MIN_KB=16777216
BUILD_MEMORY_MAX=8G
FILE_MEMORY_MAX=6G
LEAN_THREADS=2
# (no LAKE_JOBS: Lake v4.33 has no -j; LEAN_NUM_THREADS bounds lake's parallel jobs, see lbuild.sh)

# Import roots that belong to the frozen packages (checked by check_frozen.sh with `lake build --no-build +X`).
# S01-X1a (outcome P): the import's modules (AlgJL, AlgJLTests, and its vendored Definitions/FLT) are dependency modules too:
# "All targets up-to-date" over them proves that our project never builds GL2TF (OVERVIEW §3.4).
DEP_ROOTS="Mathlib Batteries Aesop Qq Plausible ProofWidgets ImportGraph LeanSearchClient Cli AlgJL AlgJLTests Definitions FLT"

# S01-X1a: the node's ONE built import (package GL2TF), target of the symlink .lake/GL2TF. Empty = derived in deps_load.sh:
# <main checkout of this repo>/lean/trace-formula-project-import/lean (from any worktree). deps_load.sh appends it to
# FROZEN_TREES. A node-local value goes into tools/deps.local.conf.
GL2TF_IMPORT=""

# R25 / MIG w1: leanchecker replays the project modules in import-ordered batches, one process per batch.
# LC_BATCH_SIZE modules per process; a batch whose peak RSS exceeds LC_BATCH_CAP_KIB (14.5 GiB) stops the audit ("R25 STOP").
LC_BATCH_SIZE=50
LC_BATCH_CAP_KIB=15204352
# MIG T2 (R25 analysis, docs/sprints/MIG-runs/T2-R25-analysis.md): leanchecker starts one task per replay ENTRY (module
# arguments are name prefixes), all at once, one Environment each; the peak follows the entries per process, not the
# listed modules. LC_BATCH_MAX_ENTRIES caps the entries per batch (prefix expansion counted; 0 = count LC_BATCH_SIZE only);
# a listing heavier than that (umbrella roots GL2TF, GL2TFTests) runs alone. LC_CPUS: every batch runs under
# `taskset -c $LC_CPUS` (user decision, D8: never more than 4 cores; empty = not pinned).
LC_BATCH_MAX_ENTRIES=12
LC_CPUS=0-3

# MIG w4: further frozen trees covered by `check_frozen.sh --sweep/--around` (incl. their .git). Not part of the D1 pin.
# v4350 is a partial clone: read-only git there lazily writes .git/objects/pack (incident 2).
SWEEP_EXTRA_TREES="/home/janosch/data/mathlib4_v4350 /home/janosch/data/gl2tf-deps-v4350"
