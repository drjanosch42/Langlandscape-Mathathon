# Langlandscape (S01-X1a, 2026-11-14; plan/implementation/OVERVIEW.md §3.3, outcome P). Our Lake project; it depends on the
# in-repo import ../trace-formula-project-import/lean (package GL2TF; submission bundle 2026-11-15, formerly the git-ignored
# symlink .lake/GL2TF), so a fresh clone builds with `lake exe cache get && lake build`. On our nodes tools/link_deps.sh
# points that directory's .lake at the node's BUILT import, and our project never builds GL2TF modules. lake-manifest.json is GENERATED by tools/make_manifest.py; this file, the manifest and
# lean-toolchain are pinned by tools/pins.sha256 (pin guard). NEVER `lake update`, `lake clean`, `lake exe cache get`;
# never call lake directly: build only via tools/lbuild.sh / tools/lfile.sh. No later WP edits this file.
name = "Langlandscape"
defaultTargets = ["Langlandscape"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Byte-equal to the import's mathlib require.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# The import (lean/trace-formula-project-import/lean of this checkout); on our nodes its built oleans are read in place.
[[require]]
name = "GL2TF"
path = "../trace-formula-project-import/lean"

# Our code: Langlandscape/<Area>/<Topic>.lean, namespace Langlandscape.<Area>.
[[lean_lib]]
name = "Langlandscape"

# Non-vacuity examples and instances of hypotheses.
[[lean_lib]]
name = "LanglandscapeTests"

# Skolem–Noether files from the Stacks project Lean port (S01-X3; srcDir created there).
[[lean_lib]]
name = "LanglandscapeVendorStacks"
srcDir = "Vendor/AxiomStacks"
globs = ["StacksCore.+"]
leanOptions = { maxSynthPendingDepth = 3 }
